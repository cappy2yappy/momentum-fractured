<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920"><rect width="1080" height="920" fill="#545252"/><g fill="#fff" font-family="Arial,sans-serif"><text x="40" y="45" font-size="28">ACTIVE KAZE / APPROVED ARIA — SOURCE COMPARISON</text><text x="40" y="75" font-size="15">Original PNGs embedded unchanged. Display crops and scale are illustrative; no sprite production.</text><text x="145" y="116" font-size="19">Active Kaze: idle frame 1</text><text x="462" y="116" font-size="19">Approved normal Aria</text><text x="793" y="116" font-size="19">Approved conditioned Aria</text></g><path d="M40 510H1040" stroke="#c6c2b8"/><svg x="105.60526315789474" y="132" width="228.78947368421052" height="378" viewBox="30 218 230 380" overflow="hidden"><image href="../../../kaze/cleaned/kaze_idle_strip.png" width="2176" height="724"/></svg><svg x="458.3112840466926" y="132" width="157.3774319066148" height="378" viewBox="275 100 535 1285" overflow="hidden"><image href="../concepts/aria-approved-concept-v01.png" width="1024" height="1536"/></svg><svg x="789.9325842696629" y="132" width="174.13483146067415" height="378" viewBox="195 94 410 890" overflow="hidden"><image href="../concepts/aria-conditioned-approved-v01.png" width="1536" height="1024"/></svg><g fill="#eee" font-family="Arial,sans-serif" font-size="16"><text x="40" y="548">Above: normalized display height for style/proportion review; this does not approve equal world stature.</text><text x="40" y="584">Below: static 1:1 world-pixel preview proposal — Kaze ~97 px, Aria ~105 px (1.08×).</text></g><path d="M40 728H1040" stroke="#c6c2b8"/><svg x="176.64473684210526" y="631" width="58.71052631578947" height="97" viewBox="30 218 230 380" overflow="hidden"><image href="../../../kaze/cleaned/kaze_idle_strip.png" width="2176" height="724"/></svg><svg x="514.6420233463035" y="623" width="43.715953307392994" height="105" viewBox="275 100 535 1285" overflow="hidden"><image href="../concepts/aria-approved-concept-v01.png" width="1024" height="1536"/></svg><svg x="855.314606741573" y="623" width="48.37078651685393" height="105" viewBox="195 94 410 890" overflow="hidden"><image href="../concepts/aria-conditioned-approved-v01.png" width="1536" height="1024"/></svg><g fill="#eee" font-family="Arial,sans-serif" font-size="16"><text x="40" y="774">Kaze has a larger head, shorter proportions, brighter violet/green blocks and stronger face contrast.</text><text x="40" y="807">Aria has longer adult proportions, darker materials and finer facial/armor detail; hardware reads weakly small.</text><text x="40" y="840">Preserve both approved identities. Creator review must settle cast style compatibility and shared scale.</text><text x="40" y="873">Kaze image: assets/kaze/cleaned/kaze_idle_strip.png at base 34be304. No historical red-scarf reference.</text></g></svg>