name: BUILD06 pinned Windows and macOS playtests
on:
  pull_request:
    branches: [ci/build05-integrated-macos]
    paths: ['tools/build06/**', '.github/workflows/build06-playtest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build06-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows
            runner: windows-2022
          - host: macos
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve exact source line endings on ephemeral runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 5dfc4c4f077c5408ecbe49f1cafafea1dcb1003c
          path: game-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned editor and export templates
        run: python tools/build06/install.py
      - name: Validate exact source and native exported package
        env:
          BUILD06_SOURCE_ROOT: ${{ github.workspace }}/game-source
        run: python tools/build06/candidate.py --godot "$GODOT" --source baseline
      - uses: actions/upload-artifact@v4
        with:
          name: Kaze-BUILD06-${{ matrix.host }}-baseline-5dfc4c4f
          path: |
            game-source/build/build06/Kaze-BUILD06-*.zip
            game-source/build/build06/MANIFEST.json
            game-source/build/build06/QA_RESULTS.json
            game-source/build/build06/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BUILD06-${{ matrix.host }}-QA
          path: |
            game-source/build/build06/evidence/
            game-source/build/build06/QA_RESULTS.json
            game-source/build/tr05/qa/*.log
            game-source/build/tr05/qa/results.json
          if-no-files-found: warn
          retention-days: 30
